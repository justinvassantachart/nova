<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nova — Browser-based C++ IDE with WASM compilation, graphics engine, and live memory visualization." />
    <title>Nova IDE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Resolve the theme before stylesheets parse so the loading screen
      // (and the first React paint) match the user's stored choice. Has
      // to be inline + synchronous — any deferred path lets the default
      // dark palette flash on light-mode users.
      try {
        var t = localStorage.getItem('nova.theme')
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark')
      } catch (_) {
        document.documentElement.setAttribute('data-theme', 'dark')
      }
    </script>
    <style>
      /* Loading screen shown until main.tsx mounts React. createRoot()
         replaces #root's children on its first render, so this gets
         cleaned up automatically — no JS-side teardown needed.
         Colors are hardcoded (not CSS vars) because the main stylesheet
         hasn't parsed yet at this point. */
      html, body { margin: 0; padding: 0; height: 100%; }
      .nova-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
        font-size: 13px;
        letter-spacing: 0.01em;
        background: #0a0a0a;
        color: rgba(255, 255, 255, 0.55);
      }
      [data-theme='light'] .nova-boot {
        background: #ffffff;
        color: rgba(0, 0, 0, 0.55);
      }
      .nova-boot-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        animation: nova-boot-pulse 1.1s ease-in-out infinite;
      }
      @keyframes nova-boot-pulse {
        0%, 100% { opacity: 0.25; transform: scale(0.8); }
        50%      { opacity: 1;    transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="nova-boot" role="status" aria-live="polite">
        <span class="nova-boot-dot" aria-hidden="true"></span>
        <span>Loading Nova…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
