<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Signing in…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; background: #0a0a0a; color: #eee; }
    .wrap { display: flex; align-items: center; justify-content: center; height: 100%; flex-direction: column; gap: 12px; text-align: center; padding: 16px; }
    .err { color: #ff7676; font-size: 13px; max-width: 360px; }
    .spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid #444; border-top-color: #aaa; animation: r 1s linear infinite; }
    @keyframes r { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spin"></div>
    <div id="msg">Working…</div>
    <div id="err" class="err"></div>
  </div>

  <!-- Firebase compat SDK from CDN — keeps this page fully static and
       self-contained. Served WITHOUT COOP/COEP (vite.config.ts +
       netlify.toml) so signInWithPopup's child OAuth popup and any
       reCAPTCHA challenges can load. -->
  <!-- Why signInWithPopup and not signInWithRedirect: the redirect flow
       relies on Firebase's helper iframe at <authDomain> to read state
       written before the redirect. On localhost (and increasingly in
       Safari/Chrome with third-party cookie restrictions) that state
       gets partitioned, getRedirectResult comes back with no user, and
       we'd loop. signInWithPopup just postMessages the credential back
       and avoids the whole hop. The tradeoff is one additional OAuth
       popup — acceptable since the bridge itself is now a tab. -->

  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script>
    (async function () {
      var params = new URLSearchParams(location.search);
      var op = params.get('op') || 'signin';
      var config = {
        apiKey: params.get('apiKey'),
        authDomain: params.get('authDomain'),
        projectId: params.get('projectId'),
        appId: params.get('appId'),
      };
      var channel = new BroadcastChannel('nova_auth');
      var errEl = document.getElementById('err');
      var msgEl = document.getElementById('msg');

      function fail(message, code) {
        errEl.textContent = message;
        channel.postMessage({ ok: false, code: code || null, error: message });
        // Leave the tab open so the user can read the error; the main
        // app already surfaced it via BroadcastChannel.
      }

      function done(payload) {
        channel.postMessage(Object.assign({ ok: true }, payload));
        // BroadcastChannel is async — give it a moment before closing so
        // the message lands in the main app before the tab disappears.
        // (The main app also has a grace period after detecting the close,
        // but redundancy is cheap here.)
        setTimeout(function () { try { window.close(); } catch (e) {} }, 250);
      }

      if (!config.apiKey || !config.authDomain) {
        fail('Missing Firebase config in URL params.');
        return;
      }

      try {
        firebase.initializeApp(config);
      } catch (e) {
        fail('Firebase init failed: ' + (e && e.message ? e.message : e));
        return;
      }

      var auth = firebase.auth();

      if (op === 'signin') {
        msgEl.textContent = 'Signing in with Google…';
        var provider = new firebase.auth.GoogleAuthProvider();
        provider.addScope('openid');
        provider.addScope('email');
        provider.addScope('profile');
        try {
          var result = await auth.signInWithPopup(provider);
          var cred = result && result.credential;
          if (!cred && firebase.auth.GoogleAuthProvider.credentialFromResult) {
            try {
              cred = firebase.auth.GoogleAuthProvider.credentialFromResult(result);
            } catch (e) { /* ignore */ }
          }
          var idToken = (cred && (cred.idToken || cred.oauthIdToken)) || null;
          var accessToken = (cred && (cred.accessToken || cred.oauthAccessToken)) || null;
          var tr = result && (result._tokenResponse || (result.user && result.user._tokenResponse));
          if (!idToken && tr) idToken = tr.oauthIdToken || tr.idToken || null;
          if (!accessToken && tr) accessToken = tr.oauthAccessToken || tr.accessToken || null;
          if (!idToken && !accessToken) {
            fail('Sign-in succeeded but no Google tokens were returned.');
            return;
          }
          done({ op: 'signin', idToken: idToken, accessToken: accessToken });
        } catch (err) {
          fail((err && (err.message || err.code)) || 'Sign-in failed', err && err.code);
        }
        return;
      }

      if (op === 'reset') {
        var email = params.get('email');
        if (!email) {
          fail('Missing email for password reset.');
          return;
        }
        msgEl.textContent = 'Sending password reset email…';
        try {
          await auth.sendPasswordResetEmail(email);
          done({ op: 'reset' });
        } catch (err) {
          fail((err && (err.message || err.code)) || 'Password reset failed', err && err.code);
        }
        return;
      }

      fail('Unknown operation: ' + op);
    })();
  </script>
</body>
</html>
