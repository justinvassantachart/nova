[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    # `require-corp` is needed for crossOriginIsolated → SharedArrayBuffer,
    # which clangd and the debugger workers depend on. Firebase Auth's
    # iframe and Firestore's Listen channel don't ship CORP headers, so
    # they would normally be blocked under require-corp — we work around
    # that with public/coep-sw.js, a service worker that rewrites their
    # responses to include `Cross-Origin-Resource-Policy: cross-origin`.
    # `credentialless` would be cleaner but Safari (≤26.5) doesn't support
    # it and silently falls back to unsafe-none.
    Cross-Origin-Embedder-Policy = "require-corp"

# Sign-in routes: strip COOP/COEP so signInWithPopup can call
# postMessage to accounts.google.com directly from the click handler
# (per Firebase docs — no async wrapping, no bridge). reCAPTCHA used by
# sendPasswordResetEmail also needs to load here. Login.tsx forces a
# hard navigation to /dashboard after auth so the isolated context is
# re-established for the SharedArrayBuffer-using debugger downstream.
[[headers]]
  for = "/login"
  [headers.values]
    Cross-Origin-Opener-Policy = "unsafe-none"
    Cross-Origin-Embedder-Policy = "unsafe-none"

[[headers]]
  for = "/"
  [headers.values]
    Cross-Origin-Opener-Policy = "unsafe-none"
    Cross-Origin-Embedder-Policy = "unsafe-none"
