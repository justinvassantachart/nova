[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    # `credentialless` instead of `require-corp` so Firebase Auth's iframe
    # and Firestore's Listen channel — which don't ship CORP headers — load
    # without being blocked, while crossOriginIsolated stays true so the
    # SharedArrayBuffer-backed clangd + debugger workers keep working.
    Cross-Origin-Embedder-Policy = "credentialless"

# Sign-in routes: strip COOP/COEP so signInWithPopup can call
# postMessage to accounts.google.com directly from the click handler
# (per Firebase docs — no async wrapping, no bridge). reCAPTCHA used by
# sendPasswordResetEmail also needs to load here. Login.tsx forces a
# hard navigation to /dashboard after auth so the isolated context is
# re-established for the SharedArrayBuffer-using debugger downstream.
[[headers]]
  for = "/login"
  [headers.values]
    Cross-Origin-Opener-Policy = "unsafe-none"
    Cross-Origin-Embedder-Policy = "unsafe-none"

[[headers]]
  for = "/"
  [headers.values]
    Cross-Origin-Opener-Policy = "unsafe-none"
    Cross-Origin-Embedder-Policy = "unsafe-none"
